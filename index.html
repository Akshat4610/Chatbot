<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshat's Assistant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: black;
        }

        .app {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: blue;
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 80px;

            scroll-behavior: smooth;

            mask-image: linear-gradient(to bottom,
                    transparent 0%,
                    black 5%,
                    black 85%,
                    transparent 100%);

            -webkit-mask-image: linear-gradient(to bottom,
                    transparent 0%,
                    black 5%,
                    black 85%,
                    transparent 100%);
        }

        .bot-msg,
        .user-msg {
            max-width: 80%;
            padding: 10px 12px;
            margin: 6px 0;
            border-radius: 10px;
            font-size: 14px;
        }

        .bot-msg {
            background: white;
            color: black;
        }

        .user-msg {
            background: #06cde8;
            color: black;
            margin-left: auto;
        }

        .chat_input {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: white;
            flex-shrink: 0;
        }

        .chat_input {
            position: sticky;
            bottom: 0;
            display: flex;
            gap: 8px;
            padding: 12px;
        }

        .chat_input input {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: 2px solid aqua;
            font-size: 15px;
            outline: none;
        }

        .chat_input button {
            padding: 12px 18px;
            background: blue;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Typing indicator */
        .typing {
            background: white;
            width: fit-content;
            padding: 8px 14px;
            border-radius: 10px;
            display: flex;
            gap: 5px;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: black;
            border-radius: 50%;
            animation: wave 1.2s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes wave {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        #feedbackBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 15px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            margin-right: -10px;
        }

        button#feedbackBtn:hover {
            background-color: darkorange;
        }

        .bot-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 10px 0;
        }

        .bot-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: transparent;
            box-shadow: none;
        }

        .floating-bot {
            position: fixed;
            bottom: 70px;
            left: 10px;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            background: transparent;
            box-shadow: none;
        }

        .floating-bot img {

            width: 90%;
            height: 90%;
            object-fit: cover;
        }

        @keyframes floatBot {

            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }

        }
    </style>
</head>

<body>

    <div class="app">
        <div class="header">Akshat's Assistant 🤖</div>

        <div class="chatBox" id="chatBox">

        </div>


        <div class="chat_input">
            <input type="text" id="userInput" placeholder="Type your message..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
    </script>
    <button id="feedbackBtn" style="display:none;" onclick="openFeedback()">
        Feedback
    </button>

    <div class="floating-bot">
        <img src="chatbot.gif" alt="bot">
    </div>


</body>

</html>
