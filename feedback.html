<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback | AKTRON</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #050505, #081c2c);
            color: white;
        }

        .feedback-container {
            width: min(100%, 500px);
            padding: 32px;
            border: 1px solid rgba(0, 255, 255, 0.35);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: aqua;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #d7e2e6;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            color: white;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid #159bb3;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: aqua;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.35);
        }

        select option {
            color: black;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .rating-box {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
        }

        .rating-box input {
            display: none;
        }

        .rating-box label {
            flex: 1;
            margin: 0;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            color: #d9e5e7;
            border: 1px solid #159bb3;
            border-radius: 9px;
            transition: 0.2s;
        }

        .rating-box input:checked+label,
        .rating-box label:hover {
            color: black;
            background: aqua;
            border-color: aqua;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            background: #00a6a6;
            transform: translateY(-2px);
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            color: #052e18;
            background: #82f7ad;
            font-size: 14px;
            font-weight: bold;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: aqua;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="feedback-container">
        <h1>Feedback for AKTRON 🤖</h1>
        <p class="subtitle">
            GIVE YOUR FEEDBACK AND HELP US IMPROVE! <br />
            Your input is valuable to us, and we appreciate your feedback. <br />
            Thank you for your feedback for making AKTRON even better!
        </p>

        <form id="feedbackForm"
            action="https://docs.google.com/forms/d/e/1FAIpQLSeV-4EuG-YzWHGW82resI8x2xWFPl6eQoj246UTzvtYHolukw/formResponse"
            method="POST" target="hidden_iframe">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="entry.1263349926" placeholder="Enter your name" required />

            <label for="email">Email Address</label>
            <input type="email" id="email" name="entry.1020646395" placeholder="Enter your email" required />

            <label for="type">Feedback Type</label>
            <select id="type" name="entry.1509190989" required>
                <option value="" selected disabled>Select feedback type</option>
                <option value="Suggestion">Suggestion</option>
                <option value="Bug Report">Bug Report</option>
                <option value="Compliment">Compliment</option>
                <option value="Other">Other</option>
            </select>

            <label>Rate your experience</label>
            <div class="rating-box">
                <input type="radio" id="rating1" name="entry.276843280" value="1" required>
                <label for="rating1">1</label>

                <input type="radio" id="rating2" name="entry.276843280" value="2">
                <label for="rating2">2</label>

                <input type="radio" id="rating3" name="entry.276843280" value="3">
                <label for="rating3">3</label>

                <input type="radio" id="rating4" name="entry.276843280" value="4">
                <label for="rating4">4</label>

                <input type="radio" id="rating5" name="entry.276843280" value="5">
                <label for="rating5">5</label>
            </div>

            <label for="feedback">Your Feedback</label>
            <textarea id="feedback" name="entry.678245824" placeholder="Write your feedback here..."
                required></textarea>

            <button type="submit">Submit Feedback</button>
        </form>

        <iframe name="hidden_iframe" style="display: none;"></iframe>

        <p id="message" style="display: none;">
            Thank you! Your feedback has been submitted. 💙
        </p>

        <a class="back-link" href="index.html">← Back to AKTRON</a>
    </main>

    <script>
        const feedbackForm = document.getElementById("feedbackForm");
        const message = document.getElementById("message");
        const submitButton = feedbackForm.querySelector('button[type="submit"]');

        feedbackForm.addEventListener("submit", () => {
            submitButton.disabled = true;
            submitButton.textContent = "Submitting...";

            setTimeout(() => {
                feedbackForm.reset();
                message.style.display = "block";

                submitButton.disabled = false;
                submitButton.textContent = "Submit Feedback";

                setTimeout(() => {
                    message.style.display = "none";
                }, 4000);
            }, 1200);
        });
    </script>

</body>

</html>
